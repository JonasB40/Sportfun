# ═══════════════════════════════════════════════════════════════
# Supabase keep-alive
#
# Gratis Supabase-projecten worden gepauzeerd na 7 dagen zonder
# database-activiteit. Deze workflow doet om de 3 dagen een kleine
# query, waardoor het project actief blijft.
#
# Draait op GitHub's servers — jouw computer hoeft niet aan te staan.
#
# De heartbeat-commit onderaan houdt óók de workflow zelf levend:
# GitHub schakelt geplande workflows uit in repositories waar 60 dagen
# geen activiteit was. De commit telt als activiteit.
# ═══════════════════════════════════════════════════════════════

name: Supabase keep-alive

on:
  schedule:
    # Dagelijks om 06:00 UTC.
    #
    # Waarom dagelijks en niet om de 3 dagen: GitHub garandeert geplande
    # runs niet — bij hoge belasting worden ze vertraagd of overgeslagen.
    # Supabase pauzeert na 7 dagen, dus dagelijks pingen betekent dat er
    # zes runs op rij mogen wegvallen voor het misgaat. De repo is publiek,
    # dus Actions-minuten zijn gratis en onbeperkt; frequenter pingen kost
    # dus niets.
    - cron: '0 6 * * *'
  # Handmatig starten kan via tabblad "Actions" → "Run workflow"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Database aanspreken
        env:
          # Deze anon-sleutel staat sowieso al publiek in public/js/supabase.js —
          # dat hoort zo. De beveiliging zit in de RLS-policies, niet in
          # het geheimhouden van deze sleutel.
          SUPABASE_URL: https://coiocqvopxgvdezuwqou.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvaW9jcXZvcHhndmRlenV3cW91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzU2OTcsImV4cCI6MjA5NTgxMTY5N30.q_c8US8ifQEeOITc7_5N8oGFHhl6Yf7YCcZSyByEHWg
        run: |
          status=$(curl --silent --show-error --location \
            --write-out '%{http_code}' --output /tmp/antwoord.json \
            --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/kampen?select=id&limit=1")

          echo "HTTP-status: $status"
          echo "Antwoord: $(cat /tmp/antwoord.json)"

          # 200 = gelukt, 401/403 = RLS blokkeert de anon-rol, maar de
          # database is wél aangesproken. Alleen 5xx of geen antwoord
          # betekent dat het project mogelijk gepauzeerd is.
          case "$status" in
            2*|401|403)
              echo "✓ Supabase reageert — project blijft actief."
              ;;
            *)
              echo "✗ Onverwachte status $status — controleer het project."
              exit 1
              ;;
          esac

      # De ping hierboven houdt Supabase wakker, maar niet GitHub:
      # geplande workflows worden uitgeschakeld in repositories waar
      # 60 dagen geen activiteit was. Een commit telt als activiteit.
      #
      # We committen niet elke dag — dat zou 365 bot-commits per jaar
      # opleveren. Eens per 14 dagen volstaat ruimschoots (4x marge op
      # de 60 dagen) en houdt de geschiedenis leesbaar.
      - name: Heartbeat vastleggen
        env:
          MAX_DAGEN: 14
        run: |
          BESTAND=.github/laatste-keepalive.txt

          # Ouderdom uit de INHOUD van het bestand lezen, niet uit
          # `git log`: actions/checkout haalt standaard maar één commit
          # op, waardoor de commit die dit bestand aanraakte vaak niet
          # in de historie zit en git log leeg zou teruggeven.
          if [ -f "$BESTAND" ] && laatste=$(date -u -d "$(cat "$BESTAND")" +%s 2>/dev/null); then
            ouderdom=$(( ( $(date -u +%s) - laatste ) / 86400 ))
            echo "Laatste heartbeat: $ouderdom dag(en) geleden."
            if [ "$ouderdom" -lt "$MAX_DAGEN" ]; then
              echo "Nog vers (< $MAX_DAGEN dagen) — geen commit nodig."
              exit 0
            fi
          else
            echo "Geen leesbare heartbeat gevonden — nu vastleggen."
          fi

          mkdir -p .github
          date -u '+%Y-%m-%d %H:%M UTC' > "$BESTAND"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Eerst stagen, dan pas vergelijken: een nog niet getrackt
          # bestand toont geen verschil bij een gewone `git diff`,
          # waardoor de commit anders altijd overgeslagen wordt.
          git add "$BESTAND"

          if git diff --cached --quiet; then
            echo "Niets gewijzigd."
            exit 0
          fi

          git commit -m "Supabase keep-alive heartbeat [skip ci]"

          # Iemand kan intussen gepusht hebben; rebasen voorkomt dat de
          # workflow faalt op een niet-fast-forward push.
          for poging in 1 2 3; do
            if git push; then
              echo "✓ Heartbeat vastgelegd."
              exit 0
            fi
            echo "Push mislukt (poging $poging) — opnieuw proberen na rebase."
            git pull --rebase --quiet || true
          done

          echo "✗ Heartbeat kon niet gepusht worden."
          exit 1
