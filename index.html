<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen — SportFun Portaal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="login-pagina">

  <div class="login-kaart">
    <!-- Logo -->
    <div class="login-logo">
      <img src="sportfun-logo2.svg" alt="SportFun"
           style="max-width:220px;height:auto;display:block;margin:0 auto 6px">
      <div class="logo-sub">Lesgeversportaal</div>
    </div>

    <!-- Loginformulier -->
    <form id="login-formulier" novalidate>
      <div class="formulier-groep">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email"
               placeholder="jouw@email.be" required autocomplete="email">
        <div class="fout-tekst verborgen" id="email-fout"></div>
      </div>

      <div class="formulier-groep">
        <label for="wachtwoord">Wachtwoord</label>
        <input type="password" id="wachtwoord" name="wachtwoord"
               placeholder="••••••••" required autocomplete="current-password">
        <div class="fout-tekst verborgen" id="wachtwoord-fout"></div>
      </div>

      <!-- Algemene foutmelding -->
      <div id="login-fout" class="verborgen" style="
        background: rgba(255,105,85,0.1);
        border: 1px solid rgba(255,105,85,0.3);
        border-radius: var(--border-radius-sm);
        padding: 10px 14px;
        font-size: 0.85rem;
        color: var(--kleur-koraal);
        margin-bottom: 16px;
      "></div>

      <button type="submit" class="knop knop-primair w-100 knop-groot" id="login-knop">
        Aanmelden
      </button>
    </form>

    <!-- Wachtwoord vergeten -->
    <div style="text-align:center;margin-top:12px">
      <button id="reset-knop" style="
        background: none;
        border: none;
        color: var(--kleur-middengroen);
        font-family: var(--font);
        font-size: 0.85rem;
        cursor: pointer;
        text-decoration: underline;
        /* Padding maakt het tikgebied 44px hoog zonder dat de tekst
           groter oogt. Zonder dit was de knop 18px — te klein om op een
           telefoon betrouwbaar te raken, terwijl dit juist de knop is
           die iemand nodig heeft wanneer inloggen niet lukt. */
        padding: 13px 12px;
        min-height: 44px;
      ">Wachtwoord vergeten?</button>
    </div>

    <!-- Reset-formulier (verborgen) -->
    <div id="reset-sectie" class="verborgen" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--kleur-lichtgrijs)">
      <p style="font-size:0.83rem;color:var(--kleur-grijs);margin-bottom:12px">
        Voer je e-mailadres in om een resetlink te ontvangen.
      </p>
      <div class="formulier-groep">
        <input type="email" id="reset-email" placeholder="jouw@email.be">
      </div>
      <button class="knop knop-middengroen w-100" id="reset-versturen">
        Resetlink sturen
      </button>
      <div id="reset-bevestiging" class="verborgen" style="
        margin-top:10px;font-size:0.83rem;color:var(--kleur-middengroen);
        text-align:center
      ">
        ✓ Resetlink verstuurd. Controleer je inbox.
      </div>
    </div>

    <!-- Nieuw wachtwoord kiezen na het volgen van een herstel-link.
         Zonder dit scherm wordt iemand die via zo'n link binnenkomt
         meteen doorgestuurd, zonder ooit een wachtwoord te kunnen
         instellen — waardoor herstel in de praktijk niets oplevert. -->
    <div id="nieuw-ww-sectie" class="verborgen">
      <p style="font-size:0.88rem;margin-bottom:14px">
        Kies een nieuw wachtwoord voor <strong id="nieuw-ww-email">je account</strong>.
      </p>
      <div class="formulier-groep">
        <label for="nieuw-ww">Nieuw wachtwoord (min. 8 tekens)</label>
        <input type="password" id="nieuw-ww" autocomplete="new-password"
               placeholder="Minimaal 8 tekens">
      </div>
      <div class="formulier-groep">
        <label for="nieuw-ww-bevestig">Herhaal wachtwoord</label>
        <input type="password" id="nieuw-ww-bevestig" autocomplete="new-password"
               placeholder="Nogmaals hetzelfde">
      </div>
      <div id="nieuw-ww-fout" class="verborgen" style="
        background:rgba(255,105,85,0.1);border:1px solid rgba(255,105,85,0.3);
        border-radius:8px;padding:10px 14px;font-size:0.85rem;
        color:var(--kleur-koraal);margin-bottom:14px"></div>
      <button class="knop knop-accent w-100 knop-groot" id="nieuw-ww-opslaan">
        Wachtwoord opslaan en inloggen
      </button>
    </div>

    <!-- Info: geen zelfregistratie -->
    <p id="geen-account-info" style="text-align:center;font-size:0.75rem;color:var(--kleur-grijs);margin-top:24px">
      Nog geen account? Vraag een uitnodiging aan bij jouw coördinator.
    </p>
  </div>

  <div id="toast-container"></div>

  <!-- Bewaar de fragment-URL vóórdat supabase-js hem leegmaakt.
       Een <script type="module"> wordt uitgesteld tot na het parsen,
       en supabase-js verwijdert bij het initialiseren het token uit de
       URL. Zonder deze momentopname is #type=recovery en een eventuele
       foutmelding daar al verdwenen tegen de tijd dat de module draait. -->
  <script>window.__hashBijLaden = window.location.hash || '';</script>

  <script type="module">
    import { supabase } from './js/supabase.js?v=1783500000000';
    import { login, stuurWachtwoordReset, haalRolOp, stuurDoorOpRol } from './js/auth.js?v=1783500000000';
    import { toonToast } from './js/utils.js?v=1783500000000';

    // ── Herstel-link herkennen ──────────────────────────────────────
    // Supabase zet het token in de fragment-URL (#access_token=...&type=recovery).
    // Dat moet vóór alles gebeuren: komt iemand via zo'n link binnen, dan
    // mag de automatische doorverwijzing hieronder NIET afgaan, anders
    // belandt hij op het dashboard zonder ooit een wachtwoord te kiezen.
    const hashParams = new URLSearchParams(
      (window.__hashBijLaden || location.hash || '').replace(/^#/, '')
    );
    const isHerstel  = ['recovery', 'magiclink', 'invite'].includes(hashParams.get('type') ?? '');
    const hashFout   = hashParams.get('error_description') || hashParams.get('error');

    function toonHerstelScherm(email) {
      document.getElementById('login-formulier').classList.add('verborgen');
      document.querySelector('.login-kaart > div:has(#reset-knop)')?.classList.add('verborgen');
      document.getElementById('reset-sectie').classList.add('verborgen');
      document.getElementById('geen-account-info')?.classList.add('verborgen');
      document.getElementById('nieuw-ww-sectie').classList.remove('verborgen');
      if (email) document.getElementById('nieuw-ww-email').textContent = email;
    }

    // Een verlopen of al gebruikte link geeft een foutmelding in de hash.
    // Zonder deze afhandeling zou de pagina er gewoon leeg uitzien.
    if (hashFout) {
      loginFoutTonen(decodeURIComponent(hashFout).replace(/\+/g, ' '));
    }

    function loginFoutTonen(tekst) {
      const el = document.getElementById('login-fout');
      el.textContent = tekst;
      el.classList.remove('verborgen');
    }

    // Supabase meldt een herstelsessie via dit event.
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        toonHerstelScherm(session?.user?.email);
      }
    });

    // Controleer of er al een actieve sessie is
    (async () => {
      // Zet de sessie expliciet op uit de tokens in de herstel-link.
      //
      // detectSessionInUrl doet dit in principe automatisch, maar dat
      // bleek hier niet betrouwbaar: het herstelscherm verscheen wel,
      // maar bij opslaan meldde Supabase "Auth session missing". Door
      // setSession zelf aan te roepen hangt het niet langer af van de
      // timing of de flow-variant van de bibliotheek.
      const accessToken  = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');

      if (isHerstel && accessToken) {
        const { data: hersteld, error: zetFout } = await supabase.auth.setSession({
          access_token:  accessToken,
          refresh_token: refreshToken ?? '',
        });

        if (zetFout) {
          loginFoutTonen(
            zetFout.message?.includes('expired')
              ? 'Deze herstel-link is verlopen. Vraag hieronder een nieuwe aan.'
              : 'Herstel-link kon niet gelezen worden: ' + zetFout.message
          );
          return;
        }

        toonHerstelScherm(hersteld?.user?.email);
        return;
      }

      const { data: { session } } = await supabase.auth.getSession();

      // Via een herstel-link zonder token in de URL: toch niet doorsturen,
      // anders verdwijnt het wachtwoordscherm meteen weer.
      if (isHerstel && session) {
        toonHerstelScherm(session.user?.email);
        return;
      }

      if (session) {
        const rol = await haalRolOp(session.user.id);
        if (rol) {
          stuurDoorOpRol(rol);
        } else {
          // Sessie geldig maar geen leesbaar profiel: dit is precies het
          // geval waarin de gebruiker anders eindeloos op de loginpagina
          // blijft zonder te weten waarom.
          loginFoutTonen(
            'Je bent aangemeld, maar je profiel kon niet geladen worden. ' +
            'Ververs de pagina of contacteer de beheerder.'
          );
        }
      }
    })();

    // ── Nieuw wachtwoord opslaan ────────────────────────────────────
    document.getElementById('nieuw-ww-opslaan').addEventListener('click', async () => {
      const ww       = document.getElementById('nieuw-ww').value;
      const bevestig = document.getElementById('nieuw-ww-bevestig').value;
      const foutEl   = document.getElementById('nieuw-ww-fout');
      const knop     = document.getElementById('nieuw-ww-opslaan');
      foutEl.classList.add('verborgen');

      if (ww.length < 8) {
        foutEl.textContent = 'Wachtwoord moet minimaal 8 tekens bevatten.';
        foutEl.classList.remove('verborgen');
        return;
      }
      if (ww !== bevestig) {
        foutEl.textContent = 'De twee wachtwoorden komen niet overeen.';
        foutEl.classList.remove('verborgen');
        return;
      }

      knop.disabled = true;
      knop.textContent = 'Opslaan…';

      // Is de sessie tussendoor weggevallen, zet hem dan opnieuw op uit
      // de tokens van de herstel-link voordat we het wachtwoord opslaan.
      const { data: { session: huidige } } = await supabase.auth.getSession();
      if (!huidige) {
        const at = hashParams.get('access_token');
        const rt = hashParams.get('refresh_token');
        if (at) {
          await supabase.auth.setSession({ access_token: at, refresh_token: rt ?? '' });
        }
      }

      const { data, error } = await supabase.auth.updateUser({ password: ww });

      if (error) {
        knop.disabled = false;
        knop.textContent = 'Wachtwoord opslaan en inloggen';
        const m = error.message ?? '';
        foutEl.textContent =
          m.includes('expired')
            ? 'Deze herstel-link is verlopen. Vraag een nieuwe aan via "Wachtwoord vergeten?".'
          : m.includes('session') || m.includes('Auth session missing')
            ? 'De herstel-link is niet meer geldig — hij is waarschijnlijk al eerder geopend. ' +
              'Vraag een nieuwe aan en open die link één keer.'
            : 'Opslaan mislukt: ' + m;
        foutEl.classList.remove('verborgen');
        return;
      }

      toonToast('Wachtwoord opgeslagen. Je wordt doorgestuurd…', 'succes');
      const rol = await haalRolOp(data.user.id);
      setTimeout(() => stuurDoorOpRol(rol ?? 'lesgever'), 1200);
    });

    // Loginformulier
    const formulier = document.getElementById('login-formulier');
    const loginKnop = document.getElementById('login-knop');
    const loginFout = document.getElementById('login-fout');

    formulier.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginFout.classList.add('verborgen');

      const email = document.getElementById('email').value.trim();
      const wachtwoord = document.getElementById('wachtwoord').value;

      if (!email || !wachtwoord) {
        loginFout.textContent = 'Vul je e-mailadres en wachtwoord in.';
        loginFout.classList.remove('verborgen');
        return;
      }

      loginKnop.disabled = true;
      loginKnop.textContent = 'Aanmelden…';

      const { gebruiker, fout } = await login(email, wachtwoord);

      if (fout) {
        loginFout.textContent = fout;
        loginFout.classList.remove('verborgen');
        loginKnop.disabled = false;
        loginKnop.textContent = 'Aanmelden';
        return;
      }

      // Controleer of het profiel bestaat
      const rol = await haalRolOp(gebruiker.id);

      if (!rol) {
        // Auth geslaagd maar geen profiel in de database
        loginFout.textContent = 'Inloggen gelukt, maar jouw profiel ontbreekt nog. Contacteer de beheerder.';
        loginFout.classList.remove('verborgen');
        loginKnop.disabled = false;
        loginKnop.textContent = 'Aanmelden';
        return;
      }

      stuurDoorOpRol(rol);
    });

    // Wachtwoord vergeten
    document.getElementById('reset-knop').addEventListener('click', () => {
      document.getElementById('reset-sectie').classList.toggle('verborgen');
    });

    document.getElementById('reset-versturen').addEventListener('click', async () => {
      const email = document.getElementById('reset-email').value.trim();
      if (!email) {
        toonToast('Voer een e-mailadres in.', 'fout');
        return;
      }
      const { succes, fout } = await stuurWachtwoordReset(email);
      if (succes) {
        document.getElementById('reset-bevestiging').classList.remove('verborgen');
      } else {
        toonToast(fout, 'fout');
      }
    });
  </script>
</body>
</html>
