# Netlify-configuratie voor het SportFun Lesgeversportaal
#
# Dit is een statische site (HTML/CSS/JS) met Supabase als backend.
# Er is geen build-stap nodig: Netlify serveert de map public/.
#
# Alleen public/ gaat online. database/, docs/, tools/ en supabase/
# blijven daarbuiten en zijn dus niet meer publiek opvraagbaar.

[build]
  publish = "public"
  command = ""

# Beveiligingsheaders voor alle pagina's
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Forceer HTTPS gedurende 1 jaar (site bevat logins)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# HTML nooit uit de cache serveren.
#
# De JS-bestanden worden geladen met ?v=<versie> erachter. Die versie
# staat in de HTML, dus zolang de browser een oude HTML uit zijn cache
# haalt, blijft hij ook de oude JS gebruiken — een nieuwe versie bereikt
# de gebruiker dan nooit, zelfs niet na Ctrl+F5 op een deelpagina.
#
# Dit is op 2026-07-28 daadwerkelijk misgegaan: fixes in js/auth.js
# bereikten de browser niet omdat het versienummer sinds 3 juli niet was
# aangepast. must-revalidate dwingt af dat de HTML telkens gecontroleerd
# wordt; de JS eronder mag dan wél lang gecached blijven, want die krijgt
# bij elke wijziging een nieuwe URL.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Afbeeldingen en logo's mogen lang gecached blijven: ze veranderen
# zelden en hebben een vaste naam.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
